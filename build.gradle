plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'KosmX'
        url = 'https://maven.kosmx.dev/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // сгибаемые локти, колени и спина + слои анимаций игрока (встраиваются в наш .jar)
    modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}"
    include "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_anim_version}"
    modImplementation "io.github.kosmx.bendy-lib:bendy-lib-fabric:${project.bendylib_version}"
    include "io.github.kosmx.bendy-lib:bendy-lib-fabric:${project.bendylib_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
