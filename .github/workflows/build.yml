name: Build mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          gradle build --stacktrace 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          cp build.log /tmp/build.log
          git checkout --orphan build-logs
          git rm -rf --cached . > /dev/null
          rm -rf ./*
          cp /tmp/build.log build.log
          git add build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Pick jar
        id: jar
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: battlegrounds-jar
          path: ${{ steps.jar.outputs.path }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Battlegrounds сборка ${{ github.run_number }}
          body: Готовый .jar для Fabric 1.20.1. Нужен Fabric API.
          files: ${{ steps.jar.outputs.path }}
